name: Release

# On a v* tag: the same eight checks, then semver images, SBOMs and notes (FR-CICD-010).
# Semver tags are for people; deployment still references the commit SHA (ADR-0003).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: sh scripts/publish-images.sh "${{ steps.meta.outputs.registry }}" "${{ steps.meta.outputs.version }}" "${{ github.sha }}"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.registry }}/civic-station-backend:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom-backend-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.registry }}/civic-station-frontend:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom-frontend-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          "sbom-backend-$GITHUB_REF_NAME.spdx.json" "sbom-frontend-$GITHUB_REF_NAME.spdx.json"
