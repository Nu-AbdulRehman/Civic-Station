name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          echo "backend=$(test -f backend/pyproject.toml && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(test -f frontend/package.json && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - if: steps.has.outputs.backend == 'yes'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: steps.has.outputs.backend == 'yes'
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app tests seeds alembic

      - if: steps.has.outputs.frontend == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.has.outputs.frontend == 'yes'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck

      # Contract drift (FR-BE-010, FR-FE-012): the committed client must match the backend's schema.
      - if: steps.has.outputs.backend == 'yes' && steps.has.outputs.frontend == 'yes'
        working-directory: frontend
        run: |
          npm run gen:types
          git diff --exit-code src/api/

  test-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Real PostgreSQL and Redis, never SQLite (AD-010). Trust auth keeps any password out of git.
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: civic_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d civic_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      # localhost is the runner reaching its own service containers, not service-to-service
      # traffic (CLAUDE.md rule 16). The name must end in _test (tests/integration/conftest.py).
      DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/civic_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          echo "unit=$(test -f backend/pyproject.toml && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "integration=$(test -f backend/alembic.ini && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.unit == 'yes'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - if: steps.has.outputs.unit == 'yes'
        working-directory: backend
        run: uv sync --frozen
      # Unit tests assume the default provider (rules); TRIAGE_PROVIDER must not leak into them.
      # Coverage gate (65 % on app/) lives in pyproject.toml.
      - if: steps.has.outputs.unit == 'yes'
        working-directory: backend
        run: uv run pytest tests/unit --cov
      - if: steps.has.outputs.integration == 'yes'
        working-directory: backend
        env:
          TRIAGE_PROVIDER: simulated
        run: uv run pytest tests/integration --cov --cov-append

  test-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "frontend=$(test -f frontend/package.json && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.frontend == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.has.outputs.frontend == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.has.outputs.frontend == 'yes'
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
          npm run build
          npm run scan:bundle

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          echo "backend=$(test -f backend/Dockerfile && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(test -f frontend/Dockerfile && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      # Build only. No registry login and no push: a PR never publishes (FR-CICD-005).
      - if: steps.has.outputs.backend == 'yes'
        run: |
          mkdir -p images
          docker build -t civic-backend:ci backend
          docker save -o images/backend.tar civic-backend:ci
      - if: steps.has.outputs.frontend == 'yes'
        run: |
          mkdir -p images
          docker build -t civic-frontend:ci frontend
          # Hard size gate, 60 MB uncompressed (NFR-PERF-007, 07-M6 §2.2).
          size=$(docker image inspect -f '{{.Size}}' civic-frontend:ci)
          echo "frontend image: $size bytes"
          test "$size" -le 60000000
          docker save -o images/frontend.tar civic-frontend:ci
      - if: steps.has.outputs.backend == 'yes' || steps.has.outputs.frontend == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images/
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          echo "backend=$(test -f backend/Dockerfile && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(test -f frontend/Dockerfile && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.backend == 'yes' || steps.has.outputs.frontend == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: images
          path: images/
      # Fail on HIGH/CRITICAL only when a fix exists (FR-CICD-006).
      - if: steps.has.outputs.backend == 'yes'
        run: >-
          docker run --rm -v "$PWD/images:/images" aquasec/trivy:0.56.2
          image --input /images/backend.tar
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - if: steps.has.outputs.frontend == 'yes'
        run: >-
          docker run --rm -v "$PWD/images:/images" aquasec/trivy:0.56.2
          image --input /images/frontend.tar
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "k8s=$(test -f k8s/overlays/prod/kustomization.yaml && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.k8s == 'yes'
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          # The VPA is a CRD; its schema comes from the CRDs catalog, pinned to a commit.
          for overlay in dev prod; do
            kubectl kustomize "k8s/overlays/$overlay" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
          test "$(kubectl kustomize k8s/overlays/prod | grep -c ':latest')" -eq 0

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "compose=$(test -f compose.yaml && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.compose == 'yes'
        run: |
          cp .env.example .env
          sed -i 's/^TRIAGE_PROVIDER=.*/TRIAGE_PROVIDER=simulated/' .env
      # --wait blocks on every healthcheck: synchronisation without sleep (NFR-REL-006).
      - if: steps.has.outputs.compose == 'yes'
        run: docker compose up -d --build --wait --wait-timeout 300
      - if: steps.has.outputs.compose == 'yes'
        run: |
          deadline=$((SECONDS + 60))
          until docker compose exec -T backend python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "/ready never returned 200"; exit 1; }
          done
      # Starred contract tests (01-api-contract.md §14), through nginx as a browser would.
      - if: steps.has.outputs.compose == 'yes'
        run: |
          base=http://127.0.0.1:8080/api
          created=$(curl -fsS -X POST "$base/complaints" -H 'Content-Type: application/json' \
            -d '{"text":"Streetlight on Main Street has been out for three nights","location":"Main Street"}')
          id=$(echo "$created" | jq -r .id)
          category=$(echo "$created" | jq -r .category)
          fetched=$(curl -fsS "$base/complaints/$id" | jq -r .category)
          test "$category" = "$fetched"

          first=$(curl -fsS -o /dev/null -D - "$base/stats" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-cache"{print $2}')
          second=$(curl -fsS -o /dev/null -D - "$base/stats" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-cache"{print $2}')
          echo "X-Cache: $first then $second"
          test "$first" = MISS && test "$second" = HIT
      # BR-SEC-001: the frontend has no route to the database. The failure must be name
      # resolution, not a ping permission error, or it proves nothing.
      - if: steps.has.outputs.compose == 'yes'
        run: |
          if out=$(docker compose exec -T frontend ping -c1 -W2 database 2>&1); then
            echo "frontend reached database: $out"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -qi "bad address"
      - if: failure() && steps.has.outputs.compose == 'yes'
        run: docker compose logs --no-color
      - if: always() && steps.has.outputs.compose == 'yes'
        run: docker compose down -v

  submission-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the §5.3 secret scan reads `git log -p` (09-M8 §10)
      - id: has
        run: echo "script=$(test -f scripts/check_submission.py && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.script == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.has.outputs.script == 'yes'
        run: python scripts/check_submission.py