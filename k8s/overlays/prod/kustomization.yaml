# Production: the Groq provider and AD-048 limits (base values). cd.yml sets both image tags and
# APP_VERSION to the commit SHA before applying (ADR-0003, AD-014):
#   kustomize edit set image civic-station-backend=ghcr.io/nu-abdulrehman/civic-station-backend:$SHA ...
# The committed tag is a placeholder, never `latest` (FR-K8S-013).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: civic-station-backend
    newName: ghcr.io/nu-abdulrehman/civic-station-backend
    newTag: PLACEHOLDER_COMMIT_SHA
  - name: civic-station-frontend
    newName: ghcr.io/nu-abdulrehman/civic-station-frontend
    newTag: PLACEHOLDER_COMMIT_SHA
configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - TRIAGE_PROVIDER=llm
      - LOG_LEVEL=INFO
      - APP_VERSION=PLACEHOLDER_COMMIT_SHA
