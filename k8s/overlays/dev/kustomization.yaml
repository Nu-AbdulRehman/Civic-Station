# Local k3d: images built by `docker compose build` and loaded with `k3d image import`
# (scripts/k3d-up.sh). Tag `dev`, never `latest`. Replicas are not changed here: the HPA owns
# them (08-M7 §7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: civic-station-backend
    newTag: dev
  - name: civic-station-frontend
    newTag: dev
configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - TRIAGE_PROVIDER=simulated
      - LOG_LEVEL=DEBUG
      - APP_VERSION=dev
# Limits halved against AD-048; requests unchanged so the HPA denominator matches prod.
patches:
  - target: { kind: Deployment, name: backend }
    patch: |
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits, value: { cpu: 250m, memory: 256Mi } }
  - target: { kind: Deployment, name: frontend }
    patch: |
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits, value: { cpu: 50m, memory: 64Mi } }
  - target: { kind: Deployment, name: redis }
    patch: |
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits, value: { cpu: 100m, memory: 128Mi } }
  - target: { kind: StatefulSet, name: postgres }
    patch: |
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits, value: { cpu: 500m, memory: 512Mi } }
