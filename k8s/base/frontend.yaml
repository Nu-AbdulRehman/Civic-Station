apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      # Off: a Service named `backend` would inject BACKEND_PORT=tcp://..., which the settings
      # object rejects as an integer (docs/failure-log.md 2026-09-28).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: civic-station-frontend
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: BACKEND_ORIGIN
              valueFrom: { configMapKeyRef: { name: app-config, key: BACKEND_ORIGIN } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # The only writable paths nginx needs: the rendered config and /tmp (07-M6 §2.2).
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 2
          resources: # AD-048
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
      volumes:
        - { name: conf, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ name: http, port: 8080, targetPort: http }]
