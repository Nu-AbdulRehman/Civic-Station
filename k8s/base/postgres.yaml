# StatefulSet, never a Deployment: postgres-0 keeps its own PVC across reschedules (FR-K8S-002).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine3.24
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_DB } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA # subdirectory, so a volume root with lost+found still initialises
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
          resources: # AD-048
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP # never NodePort/LoadBalancer (BR-SEC-005)
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
